  <meta name="theme-color" content="#fbfcf8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#141a16" media="(prefers-color-scheme: dark)" />
  <script>
    // before first paint, so dark mode never flashes light
    (function () {
      var pref = null;
      try { pref = localStorage.getItem("iitbmap-theme"); } catch (e) {}
      var dark = pref ? pref === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.classList.toggle("dark", dark);
    })();
  </script>
