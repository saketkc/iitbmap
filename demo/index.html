<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>iitbmap demo</title>
  <style>
    html, body, #map { margin: 0; height: 100%; }
    #controls {
      position: absolute; top: 12px; left: 12px; z-index: 1;
      background: #fff; padding: 14px; border-radius: 10px; color: #1e293b;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      box-shadow: 0 2px 10px rgba(15, 23, 42, .12), 0 0 0 1px rgba(15, 23, 42, .04);
      display: grid; gap: 8px; width: 300px;
    }
    #controls label { display: flex; align-items: center; gap: 6px; }
    #controls input[type="text"] {
      width: 100%; box-sizing: border-box; padding: 7px 10px;
      border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; color: inherit;
    }
    #controls input[type="text"]:focus {
      outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, .15);
    }
    #controls button {
      font: inherit; padding: 7px 12px; border-radius: 6px;
      border: 1px solid #cbd5e1; background: #f8fafc; color: inherit; cursor: pointer;
    }
    #controls button:hover { background: #f1f5f9; }
    #getDirections { background: #2563eb; border-color: #2563eb; color: #fff; font-weight: 600; }
    #getDirections:hover { background: #1d4ed8; }
    #controls hr { width: 100%; border: none; border-top: 1px solid #e2e8f0; margin: 2px 0; }
    #directions { display: grid; gap: 8px; }
    #directions .row { display: flex; gap: 6px; align-items: center; }
    #directions .row input[type="text"] { flex: 1; }

    .combobox { position: relative; }
    .combobox-list {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 2;
      margin: 0; padding: 4px; list-style: none; max-height: 220px; overflow-y: auto;
      background: #fff; border: 1px solid #e2e8f0; border-radius: 8px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, .14);
    }
    .combobox-list[hidden] { display: none; }
    .combobox-option { padding: 7px 10px; border-radius: 5px; cursor: pointer; }
    .combobox-option mark { background: none; color: #2563eb; font-weight: 600; }
    .combobox-option.active, .combobox-option:hover { background: #eff6ff; }
    .combobox-empty { padding: 7px 10px; color: #94a3b8; }

    #error { color: #b91c1c; white-space: pre-wrap; font-size: 12px; }
    #routeInfo { display: grid; gap: 4px; }
    #routeInfo button { display: block; width: 100%; text-align: left; background: #f8fafc; }
    #routeInfo button:hover { background: #eff6ff; border-color: #bfdbfe; }
  </style>
</head>
<body>
  <div id="controls">
    <label><input type="checkbox" id="dark" /> Dark mode</label>
    <label><input type="checkbox" id="buildingNames" checked /> Building names</label>
    <details>
      <summary>Advanced</summary>
      <label>Tile URL template
        <input type="text" id="tileUrl" />
      </label>
      <label>Glyphs URL template
        <input type="text" id="glyphsUrl" />
      </label>
    </details>
    <button id="apply">Apply</button>
    <div id="error"></div>

    <hr />
    <div id="directions">
      <div class="row">
        <div class="combobox">
          <input type="text" id="fromInput" placeholder="From (building or my location)" autocomplete="off"
                 role="combobox" aria-expanded="false" aria-controls="fromList" aria-autocomplete="list" />
          <ul class="combobox-list" id="fromList" role="listbox" hidden></ul>
        </div>
        <button id="useLocation" type="button" title="Use my current location">📍</button>
      </div>
      <div class="combobox">
        <input type="text" id="toInput" placeholder="To (building)" autocomplete="off"
               role="combobox" aria-expanded="false" aria-controls="toList" aria-autocomplete="list" />
        <ul class="combobox-list" id="toList" role="listbox" hidden></ul>
      </div>
      <label><input type="radio" name="profile" value="walk" checked /> Walk</label>
      <label><input type="radio" name="profile" value="drive" /> Drive</label>
      <button id="getDirections" type="button">Get directions</button>
      <div id="routeInfo"></div>
    </div>
  </div>
  <div id="map"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
